# ~/.config/foot/foot.ini
# port of wezterm.lua — neobones_dark, JetBrains Mono Bold, no chrome

[main]
font=JetBrainsMono Nerd Font:size=12:weight=bold
font-bold=JetBrainsMono Nerd Font:size=12:weight=bold
font-italic=JetBrainsMono Nerd Font:size=12:weight=bold:slant=italic
font-bold-italic=JetBrainsMono Nerd Font:size=12:weight=bold:slant=italic
pad=0x0

[scrollback]
lines=10000

[colors-dark]
alpha=1.0
background=__BG__
foreground=__TEXT__

regular0=__BORDER_INACTIVE__
regular1=__MOD_BATTERY_CRIT__
regular2=__MOD_BATTERY__
regular3=__MOD_BATTERY_WARN__
regular4=__MOD_LAUNCHER__
regular5=__MOD_PULSEAUDIO__
regular6=__MOD_COOLING__
regular7=__TEXT__

bright0=__SURFACE__
bright1=__MOD_REFRESHRATE__
bright2=__MOD_WORLDCLOCK__
bright3=__MOD_BACKLIGHT__
bright4=__MOD_CLOCK__
bright5=__MOD_MEMORY__
bright6=__MOD_TEMP__
bright7=__TEXT__

selection-foreground=__BG__
selection-background=__TEXT__
urls=__MOD_LAUNCHER__

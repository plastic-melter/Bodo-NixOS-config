# ~/.config/foot/foot.ini
# port of wezterm.lua — neobones_dark, JetBrains Mono Bold, no chrome

[main]
font=JetBrains Mono:size=12:weight=Bold, Symbols Nerd Font:size=12
pad=0x0
# foot has no ligature support at all, so harfbuzz_features={calt=0,clig=0,liga=0}
# has no equivalent — you already get what you wanted.

#[cursor]
#style=block
#blink=no
# <text-under-cursor> <cursor-body>
#color=0f191f ceddd7

#[csd]
# equivalent of window_decorations = "NONE"
#preferred=none

[scrollback]
lines=10000

#[colors]
# neobones_dark, verbatim from wezterm's scheme_data.rs
# note: foot wants bare hex, NO leading '#'
#background=0f191f
#foreground=c6d5cf


#selection-foreground=c6d5cf
#selection-background=3a3e3d

#regular0=0f191f
#regular1=de6e7c
#regular2=90ff6b
#regular3=b77e64
#regular4=8190d4
#regular5=b279a7
#regular6=66a5ad
#regular7=c6d5cf

#bright0=263945
#bright1=e8838f
#bright2=a0ff85
#bright3=d68c67
#bright4=92a0e2
#bright5=cf86c1
#bright6=65b8c1
#bright7=98a39e

# for the translucency you were experimenting with in the commented-out
# `background` block. needs a blur rule in hyprland to look right.
# alpha=0.8

#[key-bindings]
# foot's defaults are ctrl+shift+{c,v}; uncomment to change
# clipboard-copy=Control+Shift+c
# clipboard-paste=Control+Shift+v

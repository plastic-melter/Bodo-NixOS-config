add_newline = false
format = """$os\
[](bg:#__SURFACE__ fg:#__BORDER_INACTIVE__)\
$directory\
[](bg:#__BG__ fg:#__SURFACE__)\
$character"""

[os]
disabled = false
format = "[ $symbol ]($style)"
style = "fg:#__BORDER__ bg:#__BORDER_INACTIVE__"

[os.symbols]
NixOS = "󱄅"

[directory]
style = "fg:#__TEXT_DIM__ bg:#__SURFACE__"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"/etc/nixos" = " "
"/home/joe" = "~"

[character]
success_symbol = ""
error_symbol = ""

